# Datastream on a Raspberry Pi / mini PC.
#   1. cp .env.example .env   and fill it in (DATASTREAM_ENC_KEY, SETUP_TOKEN…)
#   2. mkdir -p data && sudo chown 1000:1000 data
#   3. docker compose up -d --build
name: datastream

x-app: &app
  build: .
  image: datastream:local
  restart: unless-stopped
  env_file: .env
  environment:
    # Caddy overwrites X-Forwarded-For with the real client IP.
    TRUST_PROXY: "true"
  volumes:
    - ${DATASTREAM_DATA_DIR:-./data}:/data
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *app
    expose: ["3000"]

  worker:
    <<: *app
    command: ["node", "dist/worker.mjs"]
    environment:
      TRUST_PROXY: "true"
      DATASTREAM_PROCESS: worker
    depends_on:
      web:
        condition: service_healthy # web applies migrations at startup
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const t=+require('fs').readFileSync('/tmp/datastream-worker.alive','utf8');process.exit(Date.now()-t<60000?0:1)"
      interval: 30s
      timeout: 5s
      start_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DATASTREAM_DOMAIN: ${DATASTREAM_DOMAIN:-datastream.local}
      DATASTREAM_TLS: ${DATASTREAM_TLS:-internal}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
